function home(){state=null;document.getElementById('pauseBtn').hidden=true;app.innerHTML=`<section class="hero"><div class="herocopy"><span class="pill">DZIAŁ 01 · KLASA 4</span><h1>Mała wyprawa.<br>Wielki sprawdzian.</h1><p>Tymek, przed Tobą pięć misji i finałowy BOSS. Sortuj, badaj i znajdź kierunek. Sprawdź, co już umiesz — i wzmocnij to, co jeszcze się miesza.</p><div class="startrow">${saved?'<button class="primary" id="continue">Wznów wyprawę →</button><button id="new">Od początku</button>':'<button class="primary" id="new">Ruszam na misję →</button>'}</div><span class="muted" style="font-size:12px">Około 20–30 minut · bez limitu czasu · 5 misji + BOSS</span></div><div class="heroart">${landscape()}<div class="artlabel">SPOTKANIA Z PRZYRODĄ</div></div></section><div class="missioncards">${TOPICS.map((t,i)=>`<div class="missioncard"><div class="num">MISJA 0${i+1}</div><div class="symbol" aria-hidden="true">${t.icon}</div><h3>${t.name}</h3></div>`).join('')}</div><div class="introfoot"><span>♥ 3 życia &nbsp; · &nbsp; 💡 3 podpowiedzi &nbsp; · &nbsp; ½ jedno 50:50</span><span>Po finale: 5 pytań z Twojego najsłabszego obszaru.</span></div><details class="rules"><summary>Jak zdobywać punkty?</summary><p>Poprawna odpowiedź: <b>10 pkt</b>. Z pomocą: <b>5 pkt</b>. Każde 3 poprawne odpowiedzi z rzędu bez pomocy: <b>+5 pkt</b>. Błąd lub użycie pomocy przerywa serię. Jedna odpowiedź to jedna próba — wyjaśnienie zobaczysz dopiero po niej.</p><p>Błąd zabiera jedno życie. Po utracie 3 żyć kończy się wyzwanie bezbłędności, ale dalej zdobywasz punkty w trybie treningowym i kończysz cały materiał. Podpowiedzi są wspólne dla całej gry. 50:50 usuwa dwie błędne opcje w pytaniu z czterema odpowiedziami.</p><p>Możesz przeciągać elementy albo klikać grupy. Całą grę obsłużysz także klawiszami Tab i Enter. Przycisk „Przerwa” pozwala odpocząć w dowolnym momencie.</p></details>${sourceBox()}<div class="footer">Wyprawa edukacyjna dla Tymka · bez reklam, logowania i połączeń sieciowych</div>`;
document.getElementById('new').onclick=()=>{if(saved&&!confirm('Rozpocząć od nowa i zastąpić zapisany postęp?'))return;start()};const c=document.getElementById('continue');if(c)c.onclick=()=>{state=saved;render()};}
function shell(content){const complete=state.log.filter(x=>!x.repair).length;const done=state.stage===6?state.log.filter(x=>x.repair).length:complete;const total=state.stage===6?5:MAIN;document.getElementById('pauseBtn').hidden=false;app.innerHTML=`<div class="layout"><aside class="rail"><div class="eyebrow">Dziennik wyprawy</div><h2>Twój szlak.</h2><div class="route">${[...TOPICS.map(t=>t.short),'BOSS'].map((name,i)=>`<div class="stop ${state.stage===i?'active':state.stage>i?'done':''}" ${state.stage===i?'aria-current="step"':''}><span class="badge">${state.stage>i?'✓':i===5?'★':i+1}</span><span>${name}</span></div>`).join('')}</div><div class="railtip">${state.stage===6?'Dogrywka: pięć nowych zadań, jeden obszar.':'Czytaj spokojnie. Tu liczy się rozumienie, a nie szybkość.'}<br><br>${storageOK?'Postęp zapisuje się w tej przeglądarce.':'Zapis jest niedostępny. Zostaw tę kartę otwartą do końca gry.'}</div></aside><div><div class="hud"><div class="stat"><span class="hearts" aria-label="${state.lives} życia">${'♥'.repeat(state.lives)+'♡'.repeat(3-state.lives)}</span>${state.lives===0?'<span>Trening</span>':''}</div><div class="stat">Punkty <strong>${state.score}</strong></div><div class="stat">⚡ Seria <strong>${state.streak}</strong></div><div class="stat">💡 <strong>${state.hints}</strong></div></div><div class="progressrow"><span>${state.stage===6?'Dogrywka naprawcza':'Postęp wyprawy'}</span><span>${done} / ${total}</span></div><div class="track" role="progressbar" aria-label="Postęp" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${done/total*100}%"></span></div>${content}<div class="footer">Odkrywam przyrodę 4 · dział I · możesz zrobić przerwę w każdej chwili</div></div></div>`}
function render(){if(!state){home();return}if(state.screen==='intro'){intro();return}if(state.screen==='results'||state.screen==='finished'){results();return}renderQuestion()}
function intro(){const boss=state.stage===5,t=TOPICS[state.stage];shell(`<section class="panel checkpoint"><div class="emblem" aria-hidden="true">${boss?'★':t.icon}</div><div class="eyebrow">${boss?'Finał wyprawy':'Misja 0'+(state.stage+1)}</div><h2 tabindex="-1" id="screenTitle">${boss?'BOSS: sprawdź całość':t.name}</h2><p class="muted">${boss?'10 nowych pytań ze wszystkich pięciu obszarów. Pomyśl samodzielnie, a po odpowiedzi sprawdź wyjaśnienie.':t.desc}</p><span class="pill">${queue().length} krótkich zadań · bez pośpiechu</span><p>${state.stage>0&&!boss?'Poprzednia misja ukończona. Dobry moment na łyk wody.':''}</p><button class="primary" id="begin">${boss?'Podejmuję wyzwanie':'Zaczynam misję'} →</button></section>`);document.getElementById('begin').onclick=goQuestion;document.getElementById('screenTitle').focus({preventScroll:true})}
function microscope(){const pts=[[63,8],[24,37],[40,48],[45,61],[76,50],[77,62],[31,77]];return `<div class="microscope"><svg viewBox="0 0 340 360" role="img" aria-label="Schemat mikroskopu. Wybierz literę przypisaną do wskazanej części."><path d="M235 292V136Q230 85 182 85" fill="none" stroke="#94ae96" stroke-width="34"/><path d="M119 79l28-42 42 24-28 43z" fill="#365c50"/><path d="M142 38l13-22 43 25-14 22z" fill="#163e32"/><path d="M150 97l-13 41 52 17 13-37z" fill="#c0d0b8"/><ellipse cx="158" cy="145" rx="44" ry="12" fill="#527564"/><path d="M124 146l-9 37 19 5 12-39zM155 149v49h21v-49M186 145l13 34 18-9-13-35z" fill="#263f35"/><rect x="92" y="210" width="132" height="16" rx="4" fill="#2c5544"/><path d="M128 206h62" stroke="#f9fdf0" stroke-width="8"/><circle cx="248" cy="180" r="28" fill="#315646"/><circle cx="263" cy="220" r="13" fill="#6a8a6f"/><path d="M149 288v-34" stroke="#2a4f40" stroke-width="18"/><ellipse cx="149" cy="254" rx="23" ry="11" fill="#f6c376"/><path d="M86 295h167l20 24H68z" fill="#93ae96"/><rect x="68" y="319" width="205" height="17" rx="6" fill="#284e3e"/><g stroke="#779477" stroke-width="1.5" stroke-dasharray="3 3"><path d="M211 29L178 31M82 133L155 145M136 173l26 9M153 220h20M258 180h8M262 223h10M105 277L149 254"/></g></svg>${pts.map((p,i)=>`<button class="hotspot" data-answer="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="Punkt ${PARTS[i]}">${PARTS[i]}</button>`).join('')}</div>`}
function compassHTML(){return `<div class="compass" role="group" aria-label="Róża kierunków — wybierz skrót"><div class="needle"></div><div class="hub"></div>${DIRS.map((d,i)=>{const a=i*Math.PI/4;return `<button class="direction" data-answer="${i}" style="left:${50+40*Math.sin(a)}%;top:${50-40*Math.cos(a)}%" aria-label="${d}">${d}</button>`}).join('')}</div>`}
function hazard(){return `<svg viewBox="0 0 150 150" width="110" height="110" role="img" aria-label="Czarny symbol czaszki ze skrzyżowanymi piszczelami w czerwonym rombie" style="display:block;margin:0 auto 18px"><path d="M75 7L143 75 75 143 7 75Z" fill="white" stroke="#c44543" stroke-width="7"/><g fill="#252b28"><path d="M52 88L102 111 107 100 57 77ZM99 78L46 103 51 113 104 87Z"/><path d="M49 59a26 23 0 1 1 52 0c0 13-7 18-13 20v12H63V79c-7-3-14-9-14-20"/><circle cx="49" cy="108" r="5"/><circle cx="104" cy="105" r="5"/></g><g fill="white"><ellipse cx="64" cy="61" rx="7" ry="8"/><ellipse cx="86" cy="61" rx="7" ry="8"/><path d="M75 68L70 78H80z"/><path d="M68 83v8m7-8v8m7-8v8" stroke="white" stroke-width="2"/></g></svg>`}
function renderQuestion(){const q=current();if(!q){state.screen=state.stage===6?'finished':'results';save();render();return}if(!state.order){state.order=q.type==='mc'||q.type==='hazard'?shuffle(q.opts.map((_,i)=>i)):q.opts.map((_,i)=>i);save()}const typeLabel={mc:'WYBIERZ ODPOWIEDŹ',sort:'PRZECIĄGNIJ LUB KLIKNIJ',micro:'WSKAŻ NA SCHEMACIE',compass:'WYBIERZ KIERUNEK',hazard:'ROZPOZNAJ SYMBOL'}[q.type];let task='';if(q.type==='sort'){task=`<div class="objectzone"><button class="object" id="object" aria-label="${q.label}. Przeciągnij do grupy lub wybierz grupę poniżej."><span aria-hidden="true">${q.icon}</span>${q.label}</button></div><div class="bins">${CATS.map((c,i)=>`<button class="bin" data-answer="${i}"><span aria-hidden="true">${['🌱','◈','⌂'][i]}</span>${c}</button>`).join('')}</div>`}else if(q.type==='micro'){task=`<div class="diagramrow">${microscope()}<p class="diagramkey">Każda litera oznacza jeden punkt na schemacie.<br><br><strong>Kliknij literę przy właściwej części.</strong><br>Możesz też wybrać ją klawiszem Tab i zatwierdzić Enterem.</p></div>`}else if(q.type==='compass'){task=compassHTML()}else{task=(q.type==='hazard'?hazard():'')+`<div class="answers">${state.order.map((idx,pos)=>`<button class="answer ${state.hidden.includes(idx)?'eliminated':''}" data-answer="${idx}"><span class="letter">${'ABCD'[pos]}</span><span>${escapeHTML(q.opts[idx])}</span></button>`).join('')}</div>`}shell(`<section class="panel"><div class="qtop"><span class="eyebrow">${state.stage===5?'BOSS':state.stage===6?'DOGRYWKA':'MISJA 0'+(state.stage+1)} · ${state.index+1} / ${queue().length}</span><span class="typechip">${typeLabel}</span></div><h2 class="question" id="screenTitle" tabindex="-1">${escapeHTML(q.p)}</h2><p class="instruction">${q.type==='sort'?'Przeciągnij kartę do grupy albo po prostu kliknij wybraną grupę.':'Jedna próba. Spokojnie — wyjaśnienie pojawi się po Twojej odpowiedzi.'}</p>${task}<div class="tools"><button id="hintBtn" ${state.hints<=0||state.hintUsed||state.feedback?'disabled':''}>💡 Podpowiedź (${state.hints})</button><button id="fiftyBtn" ${state.fifty<=0||state.fiftyUsed||state.feedback||q.opts.length!==4?'disabled':''}>½ 50:50 (${state.fifty})</button></div>${state.hintUsed?`<div class="hint" role="status">💡 ${escapeHTML(q.hint)}</div>`:''}<div id="feedback" aria-live="polite" aria-atomic="true"></div></section>`);
document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>answer(Number(el.dataset.answer)));
document.getElementById('hintBtn').onclick=()=>{if(state.feedback||state.hints<=0||state.hintUsed)return;state.hints--;state.hintUsed=true;state.help=true;state.streak=0;save();renderQuestion()};
document.getElementById('fiftyBtn').onclick=()=>{if(state.feedback||state.fifty<=0||state.fiftyUsed||q.opts.length!==4)return;state.fifty--;state.fiftyUsed=true;state.help=true;state.streak=0;state.hidden=shuffle(q.opts.map((_,i)=>i).filter(i=>i!==q.a)).slice(0,2);save();renderQuestion()};
if(q.type==='sort'&&!state.feedback)enableDrag();if(state.feedback)showFeedback();document.getElementById('screenTitle').focus({preventScroll:true});}
function enableDrag(){
 const obj=document.getElementById('object');let moving=false,ghost=null;
 const clear=()=>{moving=false;obj.classList.remove('dragging');if(ghost){ghost.remove();ghost=null}document.querySelectorAll('.bin').forEach(b=>b.classList.remove('over'))};
 obj.onpointerdown=e=>{if(e.button!==0)return;moving=true;obj.setPointerCapture(e.pointerId);obj.classList.add('dragging');ghost=obj.cloneNode(true);ghost.removeAttribute('id');ghost.setAttribute('aria-hidden','true');ghost.tabIndex=-1;ghost.style.cssText='position:fixed;z-index:30;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) rotate(-4deg);margin:0;';ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.append(ghost)};
 obj.onpointermove=e=>{if(!moving)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.bin').forEach(b=>{const r=b.getBoundingClientRect();b.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)})};
 obj.onpointerup=e=>{if(!moving)return;const bin=[...document.querySelectorAll('.bin')].find(b=>{const r=b.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});clear();if(bin)answer(Number(bin.dataset.answer))};obj.onpointercancel=clear;obj.onlostpointercapture=clear;
}
function answer(idx){if(state.feedback)return;const q=current();if(state.hidden.includes(idx))return;const ok=idx===q.a;let points=0,bonus=0,lostLast=false;if(ok){points=state.help?5:10;if(!state.help){state.streak++;state.best=Math.max(state.best,state.streak);if(state.streak%3===0)bonus=5}else state.streak=0;state.score+=points+bonus}else{state.streak=0;if(state.lives>0){state.lives--;lostLast=state.lives===0}}const entry={id:q.id,t:q.t,ok,help:state.help,idx,repair:state.stage===6};state.log.push(entry);state.feedback={idx,ok,points,bonus,lostLast};save();renderQuestion();if(ok)celebrate();document.getElementById('next').focus({preventScroll:true});}
function showFeedback(){const q=current(),f=state.feedback;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const i=Number(b.dataset.answer);if(i===q.a)b.classList.add('correct');if(i===f.idx&&!f.ok)b.classList.add('wrong')});const obj=document.getElementById('object');if(obj)obj.disabled=true;document.getElementById('feedback').innerHTML=`<div class="feedback ${f.ok?'':'bad'}"><span class="tagscore">${f.ok?'+'+(f.points+f.bonus)+' pkt':'0 pkt'}</span><h3>${f.ok?'✓ Dobra odpowiedź.':'↗ Sprawdź i zapamiętaj.'}</h3><p>${f.ok?'':`<b>Poprawna odpowiedź: ${escapeHTML(q.opts[q.a])}.</b> `}${escapeHTML(q.why)}</p>${f.bonus?'<p><b>Seria trzech bez pomocy: +5 pkt!</b></p>':''}${f.lostLast?'<p><b>Kończą się życia, ale wyprawa trwa.</b> Teraz grasz w trybie treningowym. Dokończymy wszystkie misje.</p>':''}<small>Podręcznik, str. ${q.src}${state.help?' · Odpowiedź z pomocą':''}</small><button class="primary" id="next">${state.index===queue().length-1?(state.stage===5?'Zobacz wyniki':state.stage===6?'Zakończ dogrywkę':'Misja ukończona'):'Dalej'} →</button></div>`;document.getElementById('next').onclick=next;}
function next(){if(!state.feedback)return;state.index++;state.feedback=null;state.help=false;state.hintUsed=false;state.fiftyUsed=false;state.hidden=[];state.order=null;if(state.index>=queue().length){if(state.stage<5){state.stage++;state.index=0;state.screen='intro'}else if(state.stage===5){prepareRepair();state.screen='results'}else{state.screen='finished'}}save();render();window.scrollTo({top:0,behavior:'instant'})}
function stats(){return TOPICS.map((t,i)=>{const a=state.log.filter(x=>!x.repair&&x.t===i);return {total:a.length,correct:a.filter(x=>x.ok).length,solo:a.filter(x=>x.ok&&!x.help).length,help:a.filter(x=>x.help).length}})}
function weakest(ss){return ss.map((s,i)=>({...s,i})).sort((a,b)=>(a.correct/a.total-b.correct/b.total)||(a.solo/a.total-b.solo/b.total)||a.i-b.i)[0].i}
function prepareRepair(){state.weak=weakest(stats());state.repair=shuffle(REPAIR[state.weak]).map(q=>q.id)}
function resultRows(ss){return ss.map((s,i)=>`<div class="resultrow"><div class="labels"><strong>${TOPICS[i].icon} ${TOPICS[i].short}</strong><span>${s.correct}/${s.total} · ${Math.round(s.correct/s.total*100)}%</span></div><div class="track"><span style="width:${s.correct/s.total*100}%"></span></div><small>${s.solo} poprawnych bez pomocy · ${s.help} prób z pomocą${state.weak===i?' · obszar dogrywki':''}</small></div>`).join('')}
function results(){const ss=stats(),base=state.log.filter(x=>!x.repair),correct=base.filter(x=>x.ok).length,percent=Math.round(correct/base.length*100),boss=base.filter(x=>x.id.startsWith('b')),rep=state.log.filter(x=>x.repair),finished=state.screen==='finished',solo=base.filter(x=>x.ok&&!x.help).length;const rank=percent>=90?'Świetna orientacja!':percent>=70?'Solidna baza.':percent>=45?'Wiesz, co ćwiczyć.':'Zróbmy krok po kroku.';shell(`<section class="panel"><div class="eyebrow">${finished?'Wyprawa zakończona':'Raport z wyprawy'}</div><div class="resulthead"><div class="ring" style="--value:${percent}"><div><b>${percent}%</b><small>${correct}/${base.length} poprawnych</small></div></div><div><h2 id="screenTitle" tabindex="-1">${finished?'Dobra robota, Tymek.':rank}</h2><p class="muted" style="margin-top:12px">BOSS: <b>${boss.filter(x=>x.ok).length}/10</b> · bez pomocy w całej wyprawie: <b>${solo}/${base.length}</b><br>${state.score} punktów · najlepsza seria: ${state.best}</p></div></div><p style="font-size:13px" class="muted">Wyniki obszarów obejmują misje i BOSS. Procent oznacza poprawne pierwsze próby, także te z pomocą. To wskazówka do powtórki, nie ocena szkolna.</p><div class="results">${resultRows(ss)}</div><div class="repairbox"><div class="eyebrow">${finished?'Dogrywka ukończona':'Twój następny krok'}</div><h3 style="margin-top:8px">${TOPICS[state.weak].icon} ${TOPICS[state.weak].name}${finished?' · '+rep.filter(x=>x.ok).length+'/5':''}</h3><p>${finished?`Pięć dodatkowych pytań za Tobą. Wynik dogrywki jest liczony osobno — nie zmienia wcześniejszej diagnozy. ${rep.every(x=>x.ok)?'Wszystkie odpowiedzi poprawne. Teraz czas na odpoczynek.':'Wróć do wyjaśnień poniżej i wskazanych stron książki.'}`:`Automatycznie ułożyłem 5 nowych pytań z obszaru z najniższym odsetkiem poprawnych odpowiedzi. Przy remisie liczą się odpowiedzi bez pomocy, a potem kolejność misji. ${percent===100?'Masz komplet poprawnych odpowiedzi — to dodatkowe utrwalenie.':''}`}</p>${finished?`<p><b>W książce: str. ${TOPICS[state.weak].pages}.</b></p>`:'<button class="primary" id="repairStart">Wzmacniam ten obszar →</button>'}</div>${finished?reviewHTML():''}<div class="toolbar"><button id="downloadResult">Zapisz wynik do pliku</button>${finished?'<button id="restart">Nowa wyprawa</button>':''}</div>${sourceBox()}</section>`);if(!finished)document.getElementById('repairStart').onclick=()=>{state.stage=6;state.index=0;state.screen='question';save();render()};document.getElementById('downloadResult').onclick=downloadResult;if(finished)document.getElementById('restart').onclick=()=>{if(confirm('Rozpocząć nową wyprawę i zastąpić ten zapis?'))start()};document.getElementById('screenTitle').focus({preventScroll:true})}
function reviewHTML(){const items=state.log.filter(x=>!x.ok||x.help);return `<details class="review"><summary>Notatnik powtórki — błędy i odpowiedzi z pomocą (${items.length})</summary>${items.length?items.map(x=>{const q=BYID[x.id];return `<article><h3>${escapeHTML(q.type==='sort'?q.label:q.p)}</h3><p>${x.ok?'✓ Poprawnie, z pomocą.':'↗ Do powtórki.'} <b>${escapeHTML(q.opts[q.a])}</b></p><p>${escapeHTML(q.why)} <span class="muted">Str. ${q.src}.</span></p></article>`}).join(''):'<p style="margin-top:14px">Wszystko poprawnie i bez pomocy. Możesz zamknąć grę i odpocząć.</p>'}</details>`}
function downloadResult(){const ss=stats(),base=state.log.filter(x=>!x.repair),rep=state.log.filter(x=>x.repair);const lines=['MISJA: PRZYRODA — WYNIK TYMKA','Dział I | Odkrywam przyrodę 4',`Data: ${new Date().toLocaleDateString('pl-PL')}`,`Pierwsze próby: ${base.filter(x=>x.ok).length}/${base.length}`,`Punkty: ${state.score}; najlepsza seria: ${state.best}`,`Pozostałe życia: ${state.lives}; pozostałe podpowiedzi: ${state.hints}`,'',...ss.map((s,i)=>`${TOPICS[i].name}: ${s.correct}/${s.total}; bez pomocy: ${s.solo}; prób z pomocą: ${s.help}`),'',`Dogrywka: ${TOPICS[state.weak].name}; ${rep.length?rep.filter(x=>x.ok).length+'/'+rep.length+' (z 5 pytań)':'jeszcze nierozpoczęta'}`,'','DO POWTÓRKI',...state.log.filter(x=>!x.ok||x.help).map(x=>{const q=BYID[x.id];return `${q.type==='sort'?q.label:q.p}\nOdpowiedź: ${q.opts[q.a]}. ${q.why} Str. ${q.src}.`})];const b=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Tymek-wynik-przyroda.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<12;i++){const s=document.createElement('i');s.className='spark';s.style.cssText=`left:${50+Math.random()*20}%;top:35%;background:${['#8cad5f','#efaa62','#3e7c63'][i%3]};--dx:${(Math.random()-.5)*240}px;--dy:${60+Math.random()*180}px;`;document.body.append(s);setTimeout(()=>s.remove(),900)}}
document.getElementById('pauseBtn').onclick=()=>document.getElementById('pauseDialog').showModal();document.getElementById('resumeBtn').onclick=()=>document.getElementById('pauseDialog').close();
home();
</script>
</body>
</html>
